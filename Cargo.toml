[package]
name = "pealayer"
version = "0.2.0"
edition = "2024"
description = "Hardware-accelerated 4D cinema player and physical-effect authoring workstation"
repository = "https://github.com/ToghrolTP/pealayer"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", features = ["glow", "persistence"] }
egui-elegance = "=0.16.1"
env_logger = "0.11.11"
libmpv2 = { version = "6.0.0", features = ["render"] }
log = "0.4.31"
jiff = "0.2.28"
libloading = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
egui_dock = { version = "0.21.1", features = ["serde"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }
serialport = "4.10.1"
httparse = "1.10.1"
httpdate = "1.0.3"
tungstenite = "0.30.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10.9"
flate2 = "1.1.9"
tar = "0.4.46"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
url = "2.5.8"
image = { version = "0.25.9", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
include_dir = "0.7.4"
raw-window-handle = "0.6.2"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
ab_glyph = "0.2"
notify = "8.2.0"
open = "5.4.4"
global-hotkey = "0.8.0"
network-interface = "2.0.5"
scraper = "0.27.0"

[build-dependencies]
winres = "0.1.12"
serde_json = "1.0.150"
ab_glyph = "0.2"
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }

[dev-dependencies]
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
strip = "symbols"
