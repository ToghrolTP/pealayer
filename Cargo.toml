[package]
name = "pealayer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", features = ["glow"] }
env_logger = "0.11.11"
libmpv2 = { version = "6.0.0", features = ["render"] }
log = "0.4.31"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
egui_dock = "0.19.1"
serialport = "4.10.1"
tiny_http = "0.12.0"
tungstenite = "0.30.0"

[build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

