[package]
name = "pealayer"
version = "0.2.0"
edition = "2024"
description = "Hardware-accelerated 4D cinema player and physical-effect authoring workstation"
repository = "https://github.com/ToghrolTP/pealayer"
license = "MIT"

[dependencies]
eframe = { version = "0.34.3", features = ["glow"] }
env_logger = "0.11.11"
libmpv2 = { version = "6.0.0", features = ["render"] }
log = "0.4.31"
jiff = "0.2.28"
libloading = "0.8.9"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
egui_dock = "0.19.1"
egui-phosphor = { version = "0.12.0", default-features = false, features = ["regular"] }
serialport = "4.10.1"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
raw-window-handle = "0.6.2"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

[build-dependencies]
winres = "0.1.12"
serde_json = "1.0.150"

[dev-dependencies]
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
strip = "symbols"
