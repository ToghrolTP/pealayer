[package]
name = "pealayer-downloader"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Standalone Pealayer download utility"

[dependencies]
pealayer-downloads = { path = "../../crates/download-core", features = ["ui"] }
serde_json = "1.0.150"
serde = { version = "1.0.229", features = ["derive"] }
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
ab_glyph = "0.2"
notify = "8.2.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSFont", "objc2-core-foundation"] }

[build-dependencies]
image = { version = "0.25.9", default-features = false, features = ["ico", "png"] }
winres = "0.1.12"
