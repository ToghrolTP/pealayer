[package]
name = "pealayer-udp-probe"
version = "0.1.0"
edition = "2024"
publish = false

# A pure transport probe: no GUI, libmpv, player, engine or hardware worker.
[workspace]
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.26.1", features = ["v4"] }
[profile.dev]
debug = 0
incremental = false
