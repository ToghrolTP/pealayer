name: "🚀 Build · Test · Release"
run-name: "🚀 Pealayer · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub release from the selected branch
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  actions: read
  contents: read

env:
  LIBMPV_WINDOWS_RELEASES_API_URL: https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
  UPX_WINDOWS_URL: https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip
  UPX_WINDOWS_SHA256: b471ebf1b7f20f4a89150264ed9a008a2a5bfd247f3c6d1184a75bb59ca08f5d
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_BACKTRACE: "1"
  TZ: UTC

jobs:
  quality:
    name: "🛡️ Repository health · Web UI"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "📥 Check out source without persisted credentials"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_ui/package-lock.json
      - name: "📦 Restore locked web dependencies"
        run: npm ci --prefix web_ui --ignore-scripts --no-audit --no-fund
      - name: "🌐 Type-check and build the web UI"
        run: npm run build --prefix web_ui
      - name: "🦀 Verify shared library and executable boundary"
        run: node scripts/check-crate-boundary.mjs
      - name: "💾 Verify low-write build defaults"
        run: node scripts/check-build-policy.mjs
      - name: "🦀 Install Rust for independent transfer checks"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: "📥 Verify shared download engine with local fixtures"
        run: cargo test --locked -p pealayer-downloads --features ui
      - name: "🐹 Install Go for actionlint"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache: false
          go-version: "1.25.x"
      - name: "✅ Validate every GitHub Actions workflow"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: "🧹 Check whitespace"
        run: git diff --check HEAD^ HEAD -- .
      - name: "⬆️ Upload verified web application"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ui-${{ github.sha }}
          path: web_ui/dist
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
      - name: "✨ Publish repository quality summary"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          # ✅ Repository health passed

          | Quality gate | Result |
          |---|---|
          | Web dependency restore | ✅ locked with `npm ci` |
          | TypeScript + Vite build | ✅ passed |
          | Generated web artifact | ✅ rebuilt from source |
          | Actions syntax | ✅ actionlint passed |
          | Whitespace | ✅ clean |
          MARKDOWN

  build:
    name: "${{ matrix.icon }} ${{ matrix.label }}"
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, label: "Linux · x86-64", icon: "🐧", os: ubuntu-24.04, binary_name: pealayer, archive_ext: tar.gz }
          - { platform: windows-x86_64, label: "Windows · x86-64", icon: "🪟", os: windows-2025, binary_name: pealayer.exe, archive_ext: zip }
          - { platform: macos-aarch64, label: "macOS · Apple silicon", icon: "🍎", os: macos-15, binary_name: pealayer, archive_ext: zip }
          - { platform: macos-x86_64, label: "macOS · Intel", icon: "🍎", os: macos-15-intel, binary_name: pealayer, archive_ext: zip }
    steps:
      - name: "📥 Check out source without persisted credentials"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "⬇️ Download verified web application"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-ui-${{ github.sha }}
          path: web_ui/dist
      - name: "🔏 Prove generated Web artifact is the only tree difference"
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=no -- . ':(exclude)web_ui/dist/**')"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
            echo 'Tracked source outside web_ui/dist changed before compilation.' >&2
            exit 1
          fi
          echo 'PEALAYER_CI_VERIFIED_SOURCE_CLEAN=true' >> "$GITHUB_ENV"
      - name: "🦀 Install stable Rust toolchain"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: "💾 Verify Windows cleanup safety without compiling"
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-storage-hygiene.ps1
      - name: "⚡ Restore Rust build cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.platform }}
      - name: "🧰 Install MinGW toolchain"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mingwBin = 'C:\msys64\mingw64\bin'
          if (-not (Test-Path $mingwBin)) { throw "Missing $mingwBin" }
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          rustup target add x86_64-pc-windows-gnu
      - name: "📦 Install Linux native dependencies"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev pkg-config libasound2-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev
      - name: "📦 Install macOS native dependencies"
        if: runner.os == 'macOS'
        run: |
          brew list mpv &>/dev/null || brew install mpv
          brew list pkg-config &>/dev/null || brew install pkg-config
          if [[ "$RUNNER_ARCH" == ARM64 ]]; then BREW_PREFIX=/opt/homebrew; else BREW_PREFIX=/usr/local; fi
          {
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/opt/mpv/lib/pkgconfig"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${BREW_PREFIX}/lib:${BREW_PREFIX}/opt/mpv/lib"
            echo "LIBRARY_PATH=${BREW_PREFIX}/lib:${BREW_PREFIX}/opt/mpv/lib"
            echo "RUSTFLAGS=-L native=${BREW_PREFIX}/lib -L native=${BREW_PREFIX}/opt/mpv/lib -C link-arg=-Wl,-rpath,${BREW_PREFIX}/lib -C link-arg=-Wl,-rpath,${BREW_PREFIX}/opt/mpv/lib"
          } >> "$GITHUB_ENV"
      - name: "🎬 Download checksum-verified libmpv"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($env:GITHUB_TOKEN) { $headers.Authorization = 'token ' + $env:GITHUB_TOKEN }
          $release = Invoke-RestMethod -Uri '${{ env.LIBMPV_WINDOWS_RELEASES_API_URL }}' -Headers $headers
          $assets = @($release.assets) | Where-Object { $_.name -match '^mpv-dev-x86_64(?:-v3)?-.*\.7z$' }
          $asset = $assets | Where-Object { $_.name -notmatch '^mpv-dev-x86_64-v3-' } | Select-Object -First 1
          if (-not $asset) { $asset = $assets | Select-Object -First 1 }
          if (-not $asset) { throw 'No x86_64 mpv-dev archive found.' }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extract = Join-Path $env:RUNNER_TEMP libmpv
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = [string]$asset.digest -replace '^sha256:', ''
          if (-not $expected -or $actual -ne $expected.ToLowerInvariant()) { throw "libmpv SHA-256 mismatch: $actual" }
          & 7z x $archive "-o$extract" -y
          $importLib = Get-ChildItem $extract -Recurse -File -Filter libmpv.dll.a | Select-Object -First 1
          if (-not $importLib) { $importLib = Get-ChildItem $extract -Recurse -File -Filter libmpv.a | Select-Object -First 1 }
          if (-not $importLib) { throw 'No GNU-compatible libmpv import library found.' }
          $dlls = Get-ChildItem $extract -Recurse -File | Where-Object { $_.Name -in @('libmpv-2.dll', 'mpv-2.dll') }
          $mpvDll = $dlls | Where-Object Name -eq libmpv-2.dll | Select-Object -First 1
          if (-not $mpvDll) { $mpvDll = $dlls | Select-Object -First 1 }
          if (-not $mpvDll) { throw 'No libmpv runtime DLL found.' }
          "MPV_DLL_PATH=$($mpvDll.FullName)" >> $env:GITHUB_ENV
          "RUSTFLAGS=-L native=$($importLib.DirectoryName)" >> $env:GITHUB_ENV
          Add-Content $env:GITHUB_PATH $mpvDll.DirectoryName
          @('### 🎬 Windows libmpv', '| Property | Value |', '|---|---|', "| Package | ``$($asset.name)`` |", "| Runtime | ``$($mpvDll.Name)`` |", "| SHA-256 | ``$actual`` |") | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: "🗜️ Install checksum-verified UPX"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP upx.zip
          $extract = Join-Path $env:RUNNER_TEMP upx
          Invoke-WebRequest '${{ env.UPX_WINDOWS_URL }}' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ env.UPX_WINDOWS_SHA256 }}') { throw "UPX SHA-256 mismatch: $actual" }
          Expand-Archive $archive $extract
          $upx = Get-ChildItem $extract -Recurse -Filter upx.exe | Select-Object -First 1
          if (-not $upx) { throw 'UPX executable not found.' }
          "UPX_PATH=$($upx.FullName)" >> $env:GITHUB_ENV
      - name: "🧪 Run Rust tests"
        if: runner.os != 'Windows'
        env:
          PEALAYER_CONFIG_FILE: ${{ runner.temp }}/pealayer-tests.json
        run: cargo test --locked -- --test-threads=1
      - name: "🧪 Run Rust tests · Windows GNU"
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: "1"
          PEALAYER_CONFIG_FILE: ${{ runner.temp }}/pealayer-tests.json
        # Native tests share process-wide libmpv and application state. Use the
        # same serial test policy as Linux/macOS; --jobs controls compilation,
        # not the number of concurrently executing tests.
        run: cargo test --locked --jobs 1 --target x86_64-pc-windows-gnu -- --test-threads=1
      - name: "🚀 Build release binary"
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p pealayer -p pealayer-downloader
      - name: "🚀 Build release binary · Windows GNU"
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p pealayer -p pealayer-downloader
      - name: "🧪 Pack and smoke-test Windows binary"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'target\x86_64-pc-windows-gnu\release\pealayer.exe'
          Copy-Item $env:MPV_DLL_PATH (Split-Path $binary) -Force
          & $env:UPX_PATH --best --lzma $binary
          if ($LASTEXITCODE) { throw "UPX compression failed: $LASTEXITCODE" }
          & $env:UPX_PATH -t $binary
          if ($LASTEXITCODE) { throw "UPX validation failed: $LASTEXITCODE" }
          . ./scripts/package-probe-windows.ps1
          [void](Invoke-PackageProbe $binary '--smoke-test' (Split-Path $binary))
          $downloader = Join-Path (Split-Path $binary) 'pealayer-downloader.exe'
          $identity = (Get-Item $downloader).VersionInfo
          if ($identity.ProductName -ne 'Pealayer Downloader' -or $identity.OriginalFilename -ne 'pealayer-downloader.exe') { throw 'Downloader resources are missing' }
          [void](Invoke-PackageProbe $downloader '--smoke-test' (Split-Path $binary))
          $source = Invoke-PackageProbe $downloader '--build-info' (Split-Path $binary) | ConvertFrom-Json
          if ($source.commit -ne $env:GITHUB_SHA -or $source.dirty) { throw 'Downloader source identity is not clean/current' }
      - name: "🧪 Smoke-test macOS binary"
        if: runner.os == 'macOS'
        run: ./target/release/pealayer --smoke-test
      - name: "📥 Smoke-test standalone utility without opening a queue"
        if: runner.os != 'Windows'
        run: ./target/release/pealayer-downloader --smoke-test
      - name: "📦 Package build output"
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          output="dist/$PLATFORM"
          mkdir -p "$output/assets/fonts" "$output/web_ui"
          binary="target/release/$BINARY_NAME"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="target/x86_64-pc-windows-gnu/release/$BINARY_NAME"; fi
          cp "$binary" README.md LICENSE "$output/"
          downloader="target/release/pealayer-downloader"
          if [[ "$RUNNER_OS" == Windows ]]; then downloader="target/x86_64-pc-windows-gnu/release/pealayer-downloader.exe"; fi
          cp "$downloader" "$output/"
          cp assets/fonts/Vazirmatn-Regular.ttf "$output/assets/fonts/"
          cp -r web_ui/dist "$output/web_ui/"
          if [[ "$RUNNER_OS" == Windows ]]; then cp "${MPV_DLL_PATH//\\//}" "$output/"; fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ "$RUNNER_ARCH" == ARM64 ]]; then prefix=/opt/homebrew; else prefix=/usr/local; fi
            for dylib in libmpv.dylib libmpv.2.dylib; do
              if [[ -f "$prefix/lib/$dylib" ]]; then cp -L "$prefix/lib/$dylib" "$output/"; fi
            done
            install_name_tool -add_rpath @executable_path "$output/$BINARY_NAME" 2>/dev/null || true
          fi
          safe_ref="${GITHUB_REF_NAME//\//-}"
          base="Pealayer-$PLATFORM-$safe_ref-${GITHUB_SHA::7}"
          if [[ "$ARCHIVE_EXT" == zip ]]; then (cd dist && 7z a "$base.zip" "$PLATFORM"); archive="dist/$base.zip"; else archive="dist/$base.tar.gz"; tar -C dist -czf "$archive" "$PLATFORM"; fi
          {
            echo "archive_path=$archive"
            echo "archive_name=$(basename "$archive")"
            echo "safe_ref=$safe_ref"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - name: "✨ Publish platform build summary"
        shell: pwsh
        run: |
          $archive = '${{ steps.package.outputs.archive_path }}'
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $archive).Length
          @('## ${{ matrix.icon }} ${{ matrix.label }}', '| Property | Result |', '|---|---|', '| Tests | ✅ passed |', '| Release build | ✅ passed |', '| Smoke test | ${{ runner.os == 'Linux' && '— build-only' || '✅ passed' }} |', '| Archive | `${{ steps.package.outputs.archive_name }}` |', "| Size | $size bytes |", "| SHA-256 | ``$hash`` |") | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: "⬆️ Upload installable bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Pealayer-${{ matrix.platform }}-${{ steps.package.outputs.safe_ref }}-${{ steps.package.outputs.short_sha }}
          path: dist/${{ matrix.platform }}/**
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
      - name: "⬆️ Stage release archive"
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}-${{ steps.package.outputs.safe_ref }}-${{ steps.package.outputs.short_sha }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    name: "✨ Release · Attested packages"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: "📖 Read curated version notes"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "⬇️ Download release packages"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: "🏷️ Prepare release identity"
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            prerelease=false
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=true
            { echo "tag=$GITHUB_REF_NAME"; echo "name=Pealayer $GITHUB_REF_NAME"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          else
            safe="${GITHUB_REF_NAME//\//-}"
            { echo "tag=branch-$safe"; echo "name=Pealayer branch build ($safe)"; echo 'prerelease=true'; } >> "$GITHUB_OUTPUT"
          fi
      - name: "📝 Generate release notes, manifest, and checksums"
        env:
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' | sort)
          [[ ${#archives[@]} -eq 4 ]] || { echo "Expected 4 archives, found ${#archives[@]}" >&2; exit 1; }
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --argjson assets "$(printf '%s\n' "${archives[@]}" | jq -R . | jq -s .)" '{format:"pealayer-release-manifest-v1",product:"Pealayer",tag:$tag,sourceSha:$sha,runUrl:$run,assets:$assets,integrity:{algorithm:"SHA-256",provenance:"GitHub artifact attestation"}}' > release-assets/release-manifest.json
          notes=docs/releases/next.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Release tags must be semantic versions' >&2; exit 1; }
            notes="docs/releases/$RELEASE_TAG.md"
          fi
          [[ -s "$notes" ]] || { echo "Missing curated change list: $notes" >&2; exit 1; }
          {
            cat "$notes"; echo; echo
            echo '> [!IMPORTANT]'; echo '> Every native package passed its platform test/build matrix and carries GitHub build provenance.'; echo
            echo '| Platform package | Verification |'; echo '|---|---|'
            for archive in "${archives[@]}"; do echo "| \`$archive\` | SHA-256 + attestation |"; done
            echo; echo '## 🔐 Verify'; echo; echo '```bash'; echo 'sha256sum --check SHA256SUMS.txt'; echo "gh attestation verify Pealayer-ARCHIVE --repo $GITHUB_REPOSITORY"; echo '```'; echo
            echo "[Build verification]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · Exact source and integrity details are in the attached release manifest."
          } > release-assets/RELEASE-NOTES.md
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
      - name: "🛡️ Attest release provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*
      - name: "🚀 Create or update GitHub release"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-assets/RELEASE-NOTES.md
          files: release-assets/*
      - name: "✨ Publish release summary"
        run: cat release-assets/RELEASE-NOTES.md >> "$GITHUB_STEP_SUMMARY"

  complete:
    name: "🚦 Pealayer · Complete"
    if: always()
    needs: [quality, build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "📋 Publish consolidated CI/CD summary"
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result() { case "$1" in success) printf '✅ passed';; skipped) printf '⏭️ skipped';; cancelled) printf '⚪ cancelled';; *) printf '❌ %s' "$1";; esac; }
          quality_status=$(result "$QUALITY_RESULT")
          build_status=$(result "$BUILD_RESULT")
          release_status=$(result "$RELEASE_RESULT")
          cat >> "$GITHUB_STEP_SUMMARY" <<MARKDOWN
          # 🚀 Pealayer CI/CD

          | Stage | Result | Coverage |
          |---|---|---|
          | 🛡️ Repository health | $quality_status | Web UI · generated assets · actionlint · whitespace |
          | 🧪 Native matrix | $build_status | Linux x86-64 · Windows x86-64 · macOS Intel · macOS Apple silicon |
          | ✨ Release | $release_status | SHA-256 · provenance attestation · GitHub Release |

          ## 📦 Run artifacts

          | Artifact | Size | Expires |
          |---|---:|---|
          MARKDOWN
          # shellcheck disable=SC2016
          artifact_rows=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | "| `\(.name)` | \(.size_in_bytes) bytes | \(.expires_at) |"') || artifact_rows='| Inventory unavailable | — | — |'
          printf '%s\n' "$artifact_rows" >> "$GITHUB_STEP_SUMMARY"
          [[ "$QUALITY_RESULT" == success && "$BUILD_RESULT" == success ]]
          [[ "$RELEASE_RESULT" == success || "$RELEASE_RESULT" == skipped ]]
