version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eframe"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "egui"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "egui-elegance"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/web_ui"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

